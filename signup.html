<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- Google Analytics 4: Panda Market Mission 2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-RGM1Y92DFH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-RGM1Y92DFH');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 | 판다마켓</title>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/auth.css" />
    <script src="./js/auth.js" defer></script>
  </head>
  <body class="auth-page signup-page">
    <main class="auth-card" aria-labelledby="signup-title">
      <a class="auth-logo" href="index.html" aria-label="판다마켓 홈">
        <img src="./images/panda-face.svg" alt="" />
        <span>판다마켓</span>
      </a>
      <h1 class="visually-hidden" id="signup-title">회원가입</h1>

      <form class="auth-form" data-auth-form="signup" novalidate>
        <div class="field" data-field="email">
          <label for="signup-email">이메일</label>
          <input
            id="signup-email"
            name="email"
            type="email"
            placeholder="이메일을 입력해 주세요"
            autocomplete="email"
          />
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field" data-field="nickname">
          <label for="signup-nickname">닉네임</label>
          <input
            id="signup-nickname"
            name="nickname"
            type="text"
            placeholder="닉네임을 입력해 주세요"
            autocomplete="nickname"
          />
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field" data-field="password">
          <label for="signup-password">비밀번호</label>
          <div class="password-field">
            <input
              id="signup-password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해 주세요"
              autocomplete="new-password"
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="비밀번호 표시"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                />
                <circle cx="12" cy="12" r="2.7" />
                <path class="eye-slash" d="M4 4 20 20" />
              </svg>
            </button>
          </div>
          <p class="field-error" aria-live="polite"></p>
        </div>
        <div class="field" data-field="passwordConfirm">
          <label for="signup-password-confirm">비밀번호 확인</label>
          <div class="password-field">
            <input
              id="signup-password-confirm"
              name="passwordConfirm"
              type="password"
              placeholder="비밀번호를 다시 한 번 입력해 주세요"
              autocomplete="new-password"
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="비밀번호 표시"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"
                />
                <circle cx="12" cy="12" r="2.7" />
                <path class="eye-slash" d="M4 4 20 20" />
              </svg>
            </button>
          </div>
          <p class="field-error" aria-live="polite"></p>
        </div>
        <button class="submit-button" type="submit" disabled>회원가입</button>
      </form>

      <section class="social-login" aria-label="간편 로그인">
        <div class="social-login-inner">
          <span>간편 로그인하기</span>
          <div class="social-buttons" aria-label="간편 로그인 제공자">
            <a class="social-button" href="https://www.google.com/" aria-label="Google">
              <img src="./images/google-login.png" alt="" />
            </a>
            <a class="social-button" href="https://www.kakaocorp.com/page/" aria-label="카카오">
              <img src="./images/kakao-login.png" alt="" />
            </a>
          </div>
        </div>
      </section>

      <p class="auth-switch">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </p>
    </main>
  </body>
</html>
