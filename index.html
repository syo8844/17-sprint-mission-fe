    <title>판다마켓</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />

  <body>
    <!-- 상단 고정 내비게이션: 로고는 메인으로, 로그인 버튼은 로그인 페이지로 이동합니다. -->
    <header class="navbar">
      <div class="nav-container">
        <a href="/" class="logo" aria-label="판다마켓 홈">
          <img src="images/panda-market-mark.svg" alt="" class="logo-icon" />
          <span class="logo-text">판다마켓</span>
        </a>

        <a href="./login.html" class="btn-primary">로그인</a>
      </div>
    </header>

    <main>
      <!-- 메인 소개 영역: 서비스 문구와 상품 둘러보기 버튼, 대표 이미지를 표시합니다. -->
      <section class="hero-section">
        <div class="hero-container">
          <div class="hero-text">
            <h1>
              <span>일상의 모든 물건을</span>
              <span>거래해 보세요</span>
            </h1>
            <a href="items.html" class="btn-primary btn-lg">구경하러 가기</a>
          </div>
          <div class="hero-image">
            <img src="images/hero-img.png" alt="판다마켓 메인 이미지" />
          </div>
        </div>
      </section>

      <!-- 주요 기능 1: 인기 상품 확인 기능을 소개합니다. -->
      <section class="feature-section">
        <div class="feature-container">
          <div class="feature-image">
            <img src="images/feature1.png" alt="인기 상품" />
          </div>
          <div class="feature-text">
            <span class="badge">Hot item</span>
            <h2><span>인기 상품을</span><span>확인해보세요</span></h2>
            <p>가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </section>

      <!-- 주요 기능 2: 원하는 상품 검색 기능을 소개합니다. 텍스트는 이미지 왼쪽에서 오른쪽 정렬합니다. -->
      <section class="feature-section reverse">
        <div class="feature-container">
          <div class="feature-image">
            <img src="images/feature2.png" alt="상품 검색" />
          </div>
          <div class="feature-text">
            <span class="badge">Search</span>
            <h2><span>구매를 원하는</span><span>상품을 검색하세요</span></h2>
            <p>구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요.</p>
          </div>
        </div>
      </section>

      <!-- 주요 기능 3: 상품 등록 및 판매 기능을 소개합니다. -->
      <section class="feature-section feature-register">
        <div class="feature-container">
          <div class="feature-image">
            <img src="images/feature3.png" alt="상품 등록 및 판매" />
          </div>
          <div class="feature-text">
            <span class="badge">register</span>
            <h2><span>판매를 원하는</span><span>상품을 등록하세요</span></h2>
            <p>어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요</p>
          </div>
        </div>
      </section>

      <!-- 하단 배너: 믿을 수 있는 판다마켓 중고 거래를 강조합니다. -->
      <section class="bottom-banner">
        <div class="banner-container">
          <h2>믿을 수 있는<br />판다마켓 중고 거래</h2>
          <div class="banner-image">
            <img src="images/bottom-banner.png" alt="판다마켓 서비스" />
          </div>
        </div>
      </section>
    </main>

    <!-- 푸터: 저작권, 정책/FAQ 링크, SNS 링크를 표시합니다. -->

      <div class="footer-container">
        <p class="copyright">©codeit - 2026</p>
        <ul class="footer-links">
          <li><a href="./privacy.html">Privacy Policy</a></li>
          <li><a href="./faq.html">FAQ</a></li>
        </ul>

          <a

            target="_blank"
            rel="noopener noreferrer"

            <img src="images/ic-facebook.svg" alt="Facebook" />
          </a>

            href="https://www.twitter.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic-twitter.svg" alt="Twitter" />
          </a>
          <a
            href="https://www.youtube.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic-youtube.svg" alt="YouTube" />
          </a>
          <a

            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="images/ic-instagram.svg" alt="Instagram" />
          </a>
        </div>
      </div>
    </footer>
